# ===================================================================
# Spring Boot 3.5.5 Test Configuration
# Based on context7 testing best practices
# ===================================================================

# Test Server Configuration
server.port=0
spring.application.name=docker-demo-spring-boot-test

# Test Logging Configuration
logging.level.io.daocloud.demo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.test=INFO

# Disable unnecessary features for testing
management.endpoints.web.exposure.include=health,info
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Test specific configuration
spring.test.database.replace=none