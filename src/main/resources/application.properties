# ===================================================================
# Spring Boot 3.5.5 Application Configuration
# Based on context7 best practices
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Application Configuration
spring.application.name=docker-demo-spring-boot
app.version=1.0.0

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=NON_NULL

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Health Check Configuration
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Info Endpoint Configuration
management.info.build.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Metrics Configuration
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.version=${app.version}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s

# Logging Configuration
logging.level.io.daocloud.demo=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx

# Docker and Container Configuration
spring.docker.compose.enabled=false

# Development Configuration (will be overridden in production)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true